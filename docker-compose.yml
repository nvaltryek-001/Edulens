services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - APP_ENV=production
    volumes:
      - edulens_data:/app/data          # database, embeddings, model cache
      - ./backend/dataset:/app/dataset  # enrollment photos (biometric - keep private)
      - ./backend/config:/app/config:ro # firebase-service-account.json, if used

volumes:
  edulens_data:
