name: CI

on:
  push:
    branches: [clean-main, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies (face model is stubbed in tests)
        run: pip install flask==3.0.0 werkzeug==3.0.1 Flask-Cors==4.0.0 PyJWT==2.8.0
      - name: Run tests
        working-directory: backend
        run: python -m unittest discover tests -v

  flutter:
    name: Flutter app (analyze, test, APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: flutter_app
        run: ./setup_platforms.sh
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        working-directory: flutter_app
        run: flutter test
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --dart-define=API_URL=http://192.168.1.50:5000
      - uses: actions/upload-artifact@v4
        with:
          name: edulens-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  android:
    name: Kotlin app (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          [ -f debug.keystore ] || keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: edulens-kotlin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
